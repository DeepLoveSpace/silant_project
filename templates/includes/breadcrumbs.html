{% if user.is_authenticated %}

    <a href="{% url 'index' %}" class="breadcrumb-item">Главная</a>
    <span class="breadcrumb-separator">›</span>
    
    {% if current_page %}

        <span class="breadcrumb-separator">›</span>
        <span class="breadcrumb-item active">{{ current_page }}</span>
    {% else %}

    {% endif %}
</nav>
{% endif %}
