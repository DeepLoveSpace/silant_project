{% load static %}

<button class="chat-toggle-btn" id="chat-toggle">💬 Связаться с поддержкой</button>

<div class="chat-window" id="chat-window">
    <div class="chat-header">
        <span>Поддержка Силант</span>
        <button class="chat-close" id="chat-close">&times;</button>
    </div>
    <div class="chat-body" id="chat-body">
        <div class="chat-message bot">Здравствуйте! Чем мы можем вам помочь?</div>
    </div>
    <div class="chat-footer">
        <input type="text" id="chat-input" placeholder="Введите сообщение...">
        <button id="chat-send">&#10148;</button>
    </div>
</div>
