{% extends 'service_book/base.html' %}
{% load static %}
{% load i18n %}

{% block content %}
<div class="logout-page">
    <div class="logout-card">
        <h1 class="logout-title">Выход из системы</h1>
        <p class="logout-text">Вы уверены, что хотите выйти из своей учётной записи?</p>
        
        <form method="POST" action="{% url 'account_logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-logout">Да, выйти</button>
            <a href="{% url 'dashboard' %}" class="btn btn-outline-dark">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
